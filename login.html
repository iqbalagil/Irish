<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk — Irish</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-pane">
                <a href="index.html" class="auth-logo">
                    <img src="asset/icon.png" alt="Irish">
                </a>

                <div class="auth-body">
                    <form class="auth-form" id="login-form" novalidate>
                        <h1>LOGIN</h1>
                        <p>Enter your email and password to sign in</p>

                        <div class="field">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="nama@email.com" required>
                        </div>
                        <div class="field">
                            <label for="password">Kata Sandi</label>
                            <input type="password" id="password" name="password" placeholder="Masukkan kata sandi"
                                required>
                        </div>
                        <p>Dont have account? <a href="./register.html" class="link" id="to-register">Sign Up</a></p>

                        <p id="login-message" class="auth-message" role="alert" aria-live="polite"></p>

                        <button type="submit" class="btn btn-primary btn-block auth-submit">Masuk</button>

                        <p>Akun demo: user@email.com / password123</p>

                        <div class="auth-divider">Or continue with</div>
                    </form>
                </div>
            </div>

            <aside class="auth-visual">
            </aside>
        </section>
    </main>

    <script>
        const form = document.getElementById('login-form');
        const message = document.getElementById('login-message');
        const demoEmail = 'user@email.com';
        const demoPassword = 'password123';

        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'auth-message ' + type;
        }

        function showToast(text) {
            const toast = document.createElement('div');
            toast.className = 'auth-toast';
            toast.textContent = text;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        const pageToast = sessionStorage.getItem('authToast');
        if (pageToast) {
            showToast(pageToast);
            sessionStorage.removeItem('authToast');
        }

        document.getElementById('to-register').addEventListener('click', () => {
            sessionStorage.setItem('authToast', 'Berpindah ke halaman register');
        });

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const savedUser = JSON.parse(localStorage.getItem('irishUser') || 'null');

            if (!email || !password) {
                showMessage('Email dan kata sandi wajib diisi.', 'error');
            } else if (!document.getElementById('email').checkValidity()) {
                showMessage('Format email belum benar.', 'error');
            } else if ((email === demoEmail && password === demoPassword) ||
                       (savedUser && email === savedUser.email && password === savedUser.password)) {
                showMessage('Login berhasil! Mengalihkan halaman...', 'success');
                setTimeout(() => window.location.href = 'index.html', 1200);
            } else {
                showMessage('Login gagal. Email atau kata sandi tidak sesuai.', 'error');
            }
        });
    </script>

</body>

</html>
