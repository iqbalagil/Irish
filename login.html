<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk — Irish</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-pane">
                <a href="index.html" class="auth-logo">
                    <img src="asset/icon.png" alt="Irish">
                </a>

                <div class="auth-body">
                    <form class="auth-form" action="index.html" method="get">
                        <h1>LOGIN</h1>
                        <p>Enter your email and password to sign in</p>

                        <div class="field">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="nama@email.com" required>
                        </div>
                        <div class="field">
                            <label for="password">Kata Sandi</label>
                            <input type="password" id="password" name="password" placeholder="Masukkan kata sandi"
                                required>
                        </div>
                       <p>Dont have account? <a href="./register.html" class="link">Sign Up</a></p>

                        <button type="submit" class="btn btn-primary btn-block auth-submit">Masuk</button>

                        <div class="auth-divider">Or continue with</div>
                    </form>
                </div>
            </div>

            <aside class="auth-visual">
            </aside>
        </section>
    </main>

</body>

</html>
