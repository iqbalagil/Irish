<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRISH</title>
<link rel="stylesheet" href="css/home.css">
</head>
<body>
<div class="wrap">

  <header>
    <button class="menu" aria-label="Open menu"></button>
    <a class="logo" href="index.html" aria-label="IRISH home">
      <img src="asset/icon.png" alt="IRISH icon">
      IRISH
    </a>
    <div class="icons">
      <a href="#" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="10" r="7"/><path d="M15 15l6 6"/></svg></a>
      <a href="#" aria-label="Cart"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 2h4l1 3h16l-3 9H8L5 4H1z"/><circle cx="9" cy="20" r="2"/><circle cx="18" cy="20" r="2"/></svg><span class="badge">99+</span></a>
    </div>
  </header>

  <section class="carousel" aria-label="Featured looks">
    <div class="track">
      <div class="slide"><img src="asset/home-asset/image-awal-1.png" alt="Featured look 1"></div>
      <div class="slide"><img src="asset/home-asset/image-awal-2.png" alt="Featured look 2"></div>
      <div class="slide"><img src="asset/home-asset/image-awal-4.png" alt="Featured look 3"></div>
      <div class="slide"><img src="asset/home-asset/image-awal-5.png" alt="Featured look 4"></div>

    </div>
  </section>
  <div class="dots"><span class="on"></span><span></span><span></span></div>

  <nav class="cats" aria-label="Categories">
    <a href="#"><img src="asset/home-asset/image-category-2.png" alt="Category 2"></a>
    <a href="#"><img src="asset/home-asset/image-category-3.png" alt="Category 3"></a>
    <a href="#"><img src="asset/home-asset/image-category-4.png" alt="Category 4"></a>
    <a href="#"><img src="asset/home-asset/image-category-5.png" alt="Category 5"></a>
  </nav>

  <section class="strip">
    <div class="pill"><i><svg viewBox="0 0 24 24"><path d="M2 14l20-9-8 17-3-7z" fill="#000"/></svg></i><span>Free shiping across world</span></div>
    <div class="pill"><i><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3" fill="#000"/><text x="12" y="16" font-size="10" text-anchor="middle" fill="#fff" font-weight="700">%</text></svg></i><span>Discount for up to 50%</span></div>
  </section>

  <section class="booking">
    <div class="rooms">
      <img src="asset/home-asset/pink-asset/card-img-1.png" alt="Pink fur room">
      <img src="asset/home-asset/pink-asset/card-img-2.png" alt="Sky window room">
    </div>
    <div class="copy">
      <h2>The Rooms</h2>
      <p>you can booking the room</p>
      <small>at Jakarta up to 10.00 pm</small>
    </div>
    <img class="cat-face" src="asset/home-asset/pink-asset/card-icon-cat.png" alt="Cat icon">
    <a class="cta" href="#">BOOKING NOW</a>
  </section>

  <section class="style">
    <h2>STYLE</h2>
    <div class="gallery">
      <img src="asset/home-asset/style-outfit/styleImage-1.png" alt="Style look 1">
      <img src="asset/home-asset/style-outfit/styleImage-2.png" alt="Style look 2">
      <img src="asset/home-asset/style-outfit/styleImage-3.png" alt="Style look 3">
      <img src="asset/home-asset/style-outfit/styleImage-4.png" alt="Style look 4">
      <img src="asset/home-asset/style-outfit/styleImage-1.png" alt="Style look 5">
      <img src="asset/home-asset/style-outfit/styleImage-2.png" alt="Style look 6">
      <img src="asset/home-asset/style-outfit/styleImage-3.png" alt="Style look 7">
      <img src="asset/home-asset/style-outfit/styleImage-4.png" alt="Style look 8">
    </div>
  </section>

</div>
</body>
</html>
