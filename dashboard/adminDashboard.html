<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Penjualan — Irish</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <script src="../js/dashboard.js" defer></script>
</head>
<body>

    <div class="dashboard">
        <aside class="sidebar">
            <a href="../index.html" class="sidebar-brand">
                <img src="../asset/icon-dashboard.png" width="32" height="32" alt="Irish">
            </a>

            <nav class="sidebar-nav">
                <a href="adminDashboard.html" class="active">
                    <img src="../asset/dashboard/barChart-icon.png" alt="" width="19" height="19">
                    Data Penjualan
                </a>
                <a href="bookingDashboard.html">
                    <img src="../asset/dashboard/home-icon.png" alt="" width="19" height="19">
                    Data Booking
                </a>
                <a href="feedbackDashboard.html">
                    <img src="../asset/dashboard/speechBubble-icon.png" alt="" width="19" height="19">
                    Feedback Pengguna
                </a>
            </nav>

            <div class="sidebar-logout">
                <a href="../index.html">
                    Keluar
                </a>
            </div>
        </aside>

        <main class="main">
            <div class="topbar">
                <h1>Data Penjualan</h1>
                <div class="topbar-profile">
                    <div>
                        <span id="nama_admin"></span>
                        <small id="email_admin"></small>
                    </div>
                    <button type="button" id="edit-profile" class="profile-edit">Ubah profil</button>
                </div>
            </div>

            <section class="stats stats-sales">
                <div class="stat-card">
                    <div>
                        <h3 id="total-sales">0</h3>
                        <p>Total Penjualan</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div>
                        <h3 id="total-revenue">Rp0</h3>
                        <p>Total Pendapatan</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div>
                        <h3 id="monthly-sales">0</h3>
                        <p>Penjualan Bulan Ini</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div>
                        <h3 id="today-revenue">Rp0</h3>
                        <p>Penjualan Hari Ini</p>
                    </div>
                </div>
            </section>

            <section class="panel">
                <div class="panel-head">
                    <h2>Rincian Penjualan</h2>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Produk</th>
                                <th>Pembeli</th>
                                <th>Tanggal</th>
                                <th>Jumlah</th>
                                <th>Total</th>
                                <th>Pembayaran</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="sales-rows"></tbody>
                    </table>
                </div>
            </section>
            <p id="sales-message" class="sales-message" role="status" aria-live="polite"></p>
        </main>
    </div>

    <dialog id="profile-dialog" class="profile-dialog" aria-labelledby="profile-title">
        <form id="profile-form">
            <h2 id="profile-title">Ubah Profil Admin</h2>
            <label for="admin-name">Username admin</label>
            <input id="admin-name" name="adminName" type="text" maxlength="80" required>
            <label for="admin-email">Email admin</label>
            <input id="admin-email" name="adminEmail" type="email" required>
            <p id="profile-message" role="status" aria-live="polite"></p>
            <div class="dialog-actions">
                <button type="button" id="cancel-profile">Batal</button>
                <button type="submit">Simpan</button>
            </div>
        </form>
    </dialog>

</body>
</html>
