<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar — Irish</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-pane">
                <a href="index.html" class="auth-logo">
                    <img src="asset/icon.png" alt="Irish">
                </a>

                <div class="auth-body">
                    <form class="auth-form" id="register-form" novalidate>
                        <h1>REGISTER</h1>
                        <p>Enter your information via username, email and password</p>

                        <div class="field">
                            <label for="nama">Username</label>
                            <input type="text" id="nama" name="nama" placeholder="user123" required>
                        </div>
                        <div class="field">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="user@email.com" required>
                        </div>
                        <div class="field-row">
                            <div class="field">
                                <label for="password">Password</label>
                                <input type="password" id="password" name="password" placeholder="Min. 8 character" required>
                            </div>
                            <div class="field">
                                <label for="password2">Password Confirmation</label>
                                <input type="password" id="password2" name="password2" placeholder="Fill password again" required>
                            </div>
                        </div>
                        <p>Already have an account <a href="./login.html" class="link" id="to-login">Sign In</a></p>

                        <p id="register-message" class="auth-message" role="alert" aria-live="polite"></p>

                        <button type="submit" class="btn btn-primary btn-block auth-submit">SIGN UP</button>
                        <div class="auth-divider">Or continue with</div>

                    </form>
                </div>
            </div>

            <aside class="auth-visual">
            </aside>
        </section>
    </main>

    <script>
        const form = document.getElementById('register-form');
        const message = document.getElementById('register-message');

        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'auth-message ' + type;
        }

        function showToast(text) {
            const toast = document.createElement('div');
            toast.className = 'auth-toast';
            toast.textContent = text;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        const pageToast = sessionStorage.getItem('authToast');
        if (pageToast) {
            showToast(pageToast);
            sessionStorage.removeItem('authToast');
        }

        document.getElementById('to-login').addEventListener('click', () => {
            sessionStorage.setItem('authToast', 'Berpindah ke halaman login');
        });

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            const username = document.getElementById('nama').value.trim();
            const emailInput = document.getElementById('email');
            const email = emailInput.value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const confirmation = document.getElementById('password2').value;

            if (!username || !email || !password || !confirmation) {
                showMessage('Semua kolom wajib diisi.', 'error');
            } else if (!emailInput.checkValidity()) {
                showMessage('Format email belum benar.', 'error');
            } else if (password.length < 8) {
                showMessage('Kata sandi minimal 8 karakter.', 'error');
            } else if (password !== confirmation) {
                showMessage('Konfirmasi kata sandi tidak sama.', 'error');
            } else {
                localStorage.setItem('irishUser', JSON.stringify({ username, email, password }));
                showMessage('Register berhasil! Silakan login.', 'success');
                setTimeout(() => window.location.href = 'login.html', 1200);
            }
        });
    </script>

</body>
</html>
