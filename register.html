<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar — Irish</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-pane">
                <a href="index.html" class="auth-logo">
                    <img src="asset/icon.png" alt="Irish">
                </a>

                <div class="auth-body">
                    <form class="auth-form" action="dashboard/adminDashboard.html" method="get">
                        <h1>REGISTER</h1>
                        <p>Enter your information via username, email and password</p>

                        <div class="field">
                            <label for="nama">Username</label>
                            <input type="text" id="nama" name="nama" placeholder="user123" required>
                        </div>
                        <div class="field">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="user@email.com" required>
                        </div>
                        <div class="field-row">
                            <div class="field">
                                <label for="password">Password</label>
                                <input type="password" id="password" name="password" placeholder="Min. 8 character" required>
                            </div>
                            <div class="field">
                                <label for="password2">Password Confirmation</label>
                                <input type="password" id="password2" name="password2" placeholder="Fill password again" required>
                            </div>
                        </div>
                        <p>Already have an account <a href="./login.html" class="link">Sign In</a></p>

                        <button type="submit" class="btn btn-primary btn-block auth-submit">SIGN UP</button>
                        <div class="auth-divider">Or continue with</div>

                    </form>
                </div>
            </div>

            <aside class="auth-visual">
            </aside>
        </section>
    </main>

</body>
</html>
